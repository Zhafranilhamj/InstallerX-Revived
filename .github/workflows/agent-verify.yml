name: Agent Verify (temporary)

# TEMPORARY diagnostic workflow: converts Spotless formatting violations and unit-test failures
# into check-run annotations, which are readable through the API. Delete this file once the
# underlying issues are fixed on the branch.

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Spotless check
        id: spotless
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew spotlessCheck --console=plain --no-configuration-cache > spotless.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 spotless.log || true

      - name: Report spotless violations
        if: always()
        run: |
          if [ ! -s spotless.log ]; then
            echo "::notice::no spotless log captured"
            exit 0
          fi
          # Annotate the files spotless lists as violations, then dump the failure tail.
          grep -E '^\s{2,}\S+\.(kt|kts)$' spotless.log | sed -E 's/^\s+//' | sort -u | head -n 20 | while read -r file; do
            [ -f "$file" ] || continue
            echo "::error file=${file},line=1::spotless reports a format violation in this file"
          done
          TAIL=$(tail -c 1800 spotless.log | tr '\n' '|' | tr '\r' ' ' | sed 's/%/%25/g')
          echo "::error title=spotless-tail::${TAIL}"

      - name: Unit tests
        id: tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew testUnstableDebugUnitTest --console=plain --no-configuration-cache > test.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 test.log || true

      - name: Report test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET

          reports = glob.glob('**/build/test-results/**/*.xml', recursive=True)
          emitted = 0
          total = 0
          for path in reports:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              cls = root.get('name') or ''
              for case in root.iter('testcase'):
                  for problem in list(case.findall('failure')) + list(case.findall('error')):
                      total += 1
                      if emitted >= 20:
                          continue
                      message = (problem.get('message') or '').strip()
                      body = (problem.text or '')
                      first = ''
                      for candidate in body.split('\n'):
                          if 'Exception' in candidate or 'Error' in candidate or candidate.startswith('expected'):
                              first = candidate.strip()
                              break
                      detail = (message + ' ' + first).strip()[:900]
                      detail = detail.replace('%', '%25').replace('\r', '').replace('\n', ' ')
                      name = f"{cls}.{case.get('name')}"
                      name = re.sub(r'[(),]', '_', name)
                      print(f"::error title={name}::{detail}")
                      emitted += 1

          if total == 0:
              print("::notice::no failing unit tests found in reports")
          else:
              print(f"::notice::failing tests: {total}")
          if not reports:
              tail = ''
              try:
                  tail = open('test.log', encoding='utf-8', errors='replace').read()[-1500:]
              except Exception:
                  pass
              tail = tail.replace('%', '%25').replace('\r', '').replace('\n', ' | ')
              print(f"::error::no test reports produced. Log tail: {tail}")
          PY
