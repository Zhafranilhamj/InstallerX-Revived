name: Agent Verify (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'ci-trigger.txt'

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: agent-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Format, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Format, test and build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          mkdir -p ci-logs ci-out
          set +e
          {
            echo "===== spotlessApply ====="
            ./gradlew spotlessApply --no-configuration-cache
            echo "SPOTLESS_EXIT=$?"
            echo "===== spotlessCheck ====="
            ./gradlew spotlessCheck --no-configuration-cache
            echo "SPOTLESS_CHECK_EXIT=$?"
            echo "===== testUnstableDebugUnitTest + assembleUnstableDebug ====="
            ./gradlew testUnstableDebugUnitTest assembleUnstableDebug --no-configuration-cache
            echo "BUILD_EXIT=$?"
          } 2>&1 | tee ci-logs/last-build.log
          cp app/build/outputs/apk/Unstable/debug/app-Unstable-debug.apk ci-out/installerx-agent.apk 2>/dev/null || true
          ls -la ci-out
          exit 0

      - name: Publish verification output
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verification output to publish"
            exit 0
          fi
          git commit -m "chore: publish agent verification output [skip ci] [skip dev]"
          git push origin HEAD:${{ github.ref_name }}
