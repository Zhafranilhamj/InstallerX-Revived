name: Agent Verify (temporary)

# TEMPORARY diagnostics workflow: runs the style and unit-test gates and republishes their
# failures as check-run annotations, which are readable from environments where the Actions log
# blob storage is not reachable. Delete once the branch is green.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  packages: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Spotless check
        id: spotless
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew spotlessCheck --no-configuration-cache --console=plain 2>&1 | tee spotless.log || true
          echo "--- style violations ---"
          grep -E '\.kts?:[0-9]+:[0-9]+' spotless.log | head -n 40 | while IFS= read -r line; do
            MESSAGE=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
            echo "::error title=spotless::${MESSAGE}"
          done
          if ! grep -qE '\.kts?:[0-9]+:[0-9]+' spotless.log; then
            grep -E 'What went wrong|Execution failed|> ' spotless.log | head -n 20 | while IFS= read -r line; do
              MESSAGE=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
              echo "::error title=spotless::${MESSAGE}"
            done
          fi

      - name: Unit tests
        id: tests
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew testUnstableDebugUnitTest --no-configuration-cache -PAPP_ID="com.rosan.installer.x.revived.test" --console=plain
          echo "TESTS_EXIT=$?" >> "$GITHUB_ENV"

      - name: Publish test failures as annotations
        if: always()
        run: |
          shopt -s nullglob
          cat > /tmp/report.py <<'PY'
          import sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              tree = ET.parse(path)
          except Exception:
              sys.exit(0)
          for case in tree.iter('testcase'):
              for failure in list(case.iter('failure')) + list(case.iter('error')):
                  message = (failure.get('message') or '').replace('%', '%25').replace('\r', ' ')
                  message = message.replace('\n', ' | ')[:900]
                  name = (case.get('classname') or '') + '.' + (case.get('name') or '')
                  print("::error title=unit-test %s :: %s" % (name, message))
          PY
          shopt -s nullglob
          for report in app/build/test-results/testUnstableDebugUnitTest/*.xml; do
            python3 /tmp/report.py "$report" || true
          done

      - name: Fail if anything failed
        if: steps.spotless.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
