name: Agent Verify (temporary)

# TEMPORARY diagnostics workflow: runs the style and unit-test gates and republishes their output
# as check-run annotations plus a diagnostics file committed back to the branch, because the Actions
# log blob storage is not reachable from the authoring environment. Delete once the branch is green.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle task to run'
        required: false
        default: 'testUnstableDebugUnitTest'
        type: string

permissions:
  contents: write
  checks: write
  packages: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Spotless check
        id: spotless
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew spotlessCheck --no-configuration-cache --console=plain > spotless.log 2>&1

      - name: Unit tests
        id: tests
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew ${{ github.event.inputs.task || 'testUnstableDebugUnitTest' }} --no-configuration-cache -PAPP_ID="com.rosan.installer.x.revived.test" --console=plain > tests.log 2>&1

      - name: Collect test failures as annotations
        if: always()
        run: |
          cat > /tmp/report.py <<'PY'
          import sys, glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  tree = ET.parse(path)
              except Exception:
                  continue
              for case in tree.iter('testcase'):
                  for failure in list(case.iter('failure')) + list(case.iter('error')):
                      message = (failure.get('message') or failure.text or '').replace('%', '%25').replace('\r', ' ')
                      message = message.replace('\n', ' | ')[:800]
                      name = (case.get('classname') or '') + '.' + (case.get('name') or '')
                      print("::error title=unit-test %s :: %s" % (name, message))
          PY
          python3 /tmp/report.py || true
          grep -nE '^(e: |w: )?file:.*\.kts?:[0-9]+:[0-9]+|\.kts?:[0-9]+:[0-9]+ (error|warning)' spotless.log tests.log 2>/dev/null | head -n 40 | while IFS= read -r line; do
            printf '::error title=compile::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
          done || true

      - name: Commit diagnostics
        if: always()
        run: |
          {
            echo "# Verification diagnostics"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Spotless outcome: ${{ steps.spotless.outcome }}"
            echo "Tests outcome: ${{ steps.tests.outcome }}"
            echo
            echo '## spotless.log (tail)'
            echo '```'
            tail -n 120 spotless.log 2>/dev/null || echo 'no spotless log'
            echo '```'
            echo
            echo '## tests.log (tail)'
            echo '```'
            tail -n 200 tests.log 2>/dev/null || echo 'no test log'
            echo '```'
            echo
            echo '## failing test methods'
            echo '```'
            grep -rhE '<failure|<error' app/build/test-results 2>/dev/null | head -n 60 || echo 'none'
            echo '```'
          } > agent-diagnostics.md
          git config user.name "agent-verify"
          git config user.email "agent-verify@users.noreply.github.com"
          git add agent-diagnostics.md
          git commit -m "chore(ci): verification diagnostics [skip preview] [skip dev]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Fail if anything failed
        if: steps.spotless.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
