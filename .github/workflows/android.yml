name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "app-process/**"
      - "hidden-api/**"
      - "build-plugins/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "app-process/**"
      - "hidden-api/**"
      - "build-plugins/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build_apk:
    name: Build Unstable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check code formatting
        id: format
        continue-on-error: true
        run: ./gradlew spotlessCheck --no-configuration-cache

      - name: Capture formatter patch for the agent
        if: steps.format.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew spotlessApply --no-configuration-cache
          git diff --binary > /tmp/spotless.patch
          split -b 45000 -d /tmp/spotless.patch /tmp/spotless-patch-
          for chunk in /tmp/spotless-patch-*; do
            echo "::error title=ArenaFormatPatch-$(basename "$chunk")::$(base64 -w0 "$chunk")"
          done

      - name: Run unit tests
        id: tests
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testUnstableDebugUnitTest --no-configuration-cache 2>&1 | tee /tmp/unit-tests.log

      - name: Capture test diagnostics for the agent
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 2500 /tmp/unit-tests.log > /tmp/unit-tests-tail.log
          split -b 45000 -d /tmp/unit-tests-tail.log /tmp/unit-tests-chunk-
          for chunk in /tmp/unit-tests-chunk-*; do
            echo "::error title=ArenaTestLog-$(basename "$chunk")::$(base64 -w0 "$chunk")"
          done
          exit 1

      - name: Build Unstable Debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleUnstableDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: InstallerX-Revived-Unstable-debug
          path: app/build/outputs/apk/Unstable/debug/app-Unstable-debug.apk
          if-no-files-found: error
          retention-days: 14
          archive: false
