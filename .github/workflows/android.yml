name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "app-process/**"
      - "hidden-api/**"
      - "build-plugins/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "app-process/**"
      - "hidden-api/**"
      - "build-plugins/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  build_apk:
    name: Build Unstable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        id: tests
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew testUnstableDebugUnitTest --no-configuration-cache 2>&1 | tee /tmp/test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build Unstable Debug APK
        id: build
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew assembleUnstableDebug --no-configuration-cache 2>&1 | tee /tmp/build-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report failures
        if: steps.tests.outputs.status != '0' || steps.build.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI debug output"
            echo ""
            echo "Test exit code: ${{ steps.tests.outputs.status }}"
            echo "Build exit code: ${{ steps.build.outputs.status }}"
            echo ""
            echo "### Unit test output (last 250 lines)"
            echo '```'
            tail -n 250 /tmp/test-output.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "### Build output (last 250 lines)"
            echo '```'
            tail -n 250 /tmp/build-output.txt 2>/dev/null || true
            echo '```'
          } > /tmp/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/report.md

      - name: Upload APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: InstallerX-Revived-Unstable-debug
          path: app/build/outputs/apk/Unstable/debug/app-Unstable-debug.apk
          if-no-files-found: error
          retention-days: 14
          archive: false
