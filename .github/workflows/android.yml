name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "app-process/**"
      - "hidden-api/**"
      - "build-plugins/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "app/**"
      - "app-process/**"
      - "hidden-api/**"
      - "build-plugins/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  build_apk:
    name: Build Unstable Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-configuration-cache

      - name: Run unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew testUnstableDebugUnitTest --no-configuration-cache

      - name: Build Unstable Debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleUnstableDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: InstallerX-Revived-Unstable-debug
          path: app/build/outputs/apk/Unstable/debug/app-Unstable-debug.apk
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Publish APK to agent branch (temporary)
        if: github.ref_name == 'arena/c6c063fb-installerx-revived'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp app/build/outputs/apk/Unstable/debug/app-Unstable-debug.apk ci-out/installerx-android-yml.apk
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add ci-out/installerx-android-yml.apk
          git commit -m "chore: publish android.yml APK [skip ci] [skip dev]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
