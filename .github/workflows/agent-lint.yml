name: Agent Lint (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint preview release
        id: lint
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:lintPreviewRelease --no-configuration-cache --console=plain > /tmp/lint.log 2>&1

      - name: Commit diagnostics
        if: always()
        run: |
          {
            echo "# Lint diagnostics"
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo "Outcome: ${{ steps.lint.outcome }}"
            echo '```'
            tail -n 150 /tmp/lint.log 2>/dev/null || echo 'no lint log'
            echo '```'
            echo
            echo '## lint errors'
            echo '```'
            grep -hE '(Error|error):' app/build/reports/lint-results-previewRelease.txt 2>/dev/null | head -n 40 || echo 'none'
            echo '```'
          } > agent-lint.md
          git config user.name "agent-verify"
          git config user.email "agent-verify@users.noreply.github.com"
          git add agent-lint.md
          git commit -m "chore(ci): lint diagnostics [skip preview] [skip dev]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Fail if lint failed
        if: steps.lint.outcome != 'success'
        run: exit 1
